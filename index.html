<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <!-- Bloqueo absoluto de zoom y escala en dispositivos móviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mis Enlaces — Hub Profesional</title>
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-surface-hover: #18181b;
      --bg-card: #121215;
      --bg-card-hover: #18181b;
      --border: #27272a;
      --border-focus: #52525b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #f4f4f5;
      --accent-hover: #ffffff;
      --danger: #f87171;
      --success: #34d399;
      --radius: 12px;
      --radius-sm: 8px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    /* Adaptabilidad inteligente a temas claros/oscuros del sistema si se desea, manteniendo el núcleo oscuro elegante */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-base: #fafafa;
        --bg-surface: #ffffff;
        --bg-surface-hover: #f4f4f5;
        --bg-card: #ffffff;
        --bg-card-hover: #fcfcfc;
        --border: #e4e4e7;
        --border-focus: #a1a1aa;
        --text-main: #09090b;
        --text-muted: #71717a;
        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation; /* Bloquea doble toque para zoom */
      overflow-x: hidden;
      padding-bottom: 40px;
    }

    /* --- CONTENEDOR PRINCIPAL --- */
    #app-content {
      width: 100%;
      max-width: 1000px;
      padding: 0 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    /* --- CABECERA PROFESIONAL --- */
    header {
      width: 100%;
      padding: 36px 0 24px 0;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 20;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .brand-info h1 { 
      font-size: 1.15rem; 
      font-weight: 600; 
      letter-spacing: -0.01em;
    }

    .brand-info span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Botones de Estilo Superior */
    .btn-primary, .btn-secondary, .btn-google {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all var(--transition);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .btn-primary {
      background: var(--text-main);
      color: var(--bg-base);
      border-color: transparent;
    }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

    .btn-secondary:hover, .btn-google:hover { 
      background-color: var(--bg-surface-hover); 
      border-color: var(--border-focus); 
    }

    .btn-google {
      background: #ffffff;
      color: #18181b;
      border: 1px solid #e4e4e7;
    }
    .btn-google:hover { background: #f4f4f5 !important; }
    .btn-google svg { width: 15px; height: 15px; }

    /* Perfil de Usuario Conectado */
    .user-profile-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 4px 12px 4px 6px;
      border-radius: 50px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .btn-logout { 
      color: var(--danger); 
      background: transparent;
      border: none;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      padding: 4px 6px;
    }
    .btn-logout:hover { opacity: 0.8; }

    /* --- BARRA DE BÚSQUEDA --- */
    .search-wrapper {
      position: relative;
      width: 100%;
      margin-top: 16px;
    }

    .search-wrapper input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 16px 12px 42px;
      font-size: 0.95rem;
      outline: none;
      border-radius: var(--radius);
      transition: all var(--transition);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.02);
    }
    .search-wrapper input:focus { 
      border-color: var(--border-focus); 
      box-shadow: 0 0 0 3px rgba(161, 161, 170, 0.1); 
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    /* --- GRID DE ENLACES --- */
    main { width: 100%; }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .link-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }
    .link-card:hover { 
      border-color: var(--border-focus); 
      background-color: var(--bg-card-hover); 
      transform: translateY(-3px); 
    }

    .link-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .link-favicon-wrapper {
      width: 32px;
      height: 32px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-favicon {
      width: 16px;
      height: 16px;
      object-fit: contain;
    }

    .link-actions-group {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity var(--transition);
    }
    .link-card:hover .link-actions-group { opacity: 1; }

    .btn-card-action {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      transition: all var(--transition);
    }
    .btn-card-action:hover { color: var(--text-main); border-color: var(--border-focus); background: var(--bg-surface-hover); }
    .btn-delete:hover { color: var(--danger); border-color: rgba(248, 113, 113, 0.4); }

    .link-info h3 {
      font-size: 0.95rem; 
      font-weight: 500; 
      margin-bottom: 4px;
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .link-info p {
      font-size: 0.78rem; 
      color: var(--text-muted);
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
    }

    /* --- MODAL PROFESIONAL --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-surface); width: 100%; max-width: 400px;
      padding: 28px; border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .modal h2 { margin-bottom: 20px; font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input {
      width: 100%; background: var(--bg-base); border: 1px solid var(--border);
      color: var(--text-main); padding: 12px 14px; border-radius: var(--radius-sm);
      font-size: 0.95rem; outline: none; transition: border-color var(--transition);
    }
    .input-group input:focus { border-color: var(--border-focus); }

    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-cancel, .btn-submit { flex: 1; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.9rem; font-weight: 500; border: none; }
    .btn-cancel { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
    .btn-cancel:hover { background: var(--bg-surface-hover); }
    .btn-submit { background: var(--text-main); color: var(--bg-base); }
    .btn-submit:hover { opacity: 0.9; }

    /* Notificación flotante (Toast) */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-main);
      color: var(--bg-base);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      grid-column: 1 / -1;
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* Forzar visibilidad de botones de acción en pantallas táctiles de móviles */
    @media (max-width: 768px) {
      .link-actions-group { opacity: 1; }
    }
  </style>

  <!-- Firebase SDKs (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6uQzOIIt2vM54CR27G4hvJDWz_NKv61Y",
      authDomain: "el-baul-de-fernando.firebaseapp.com",
      projectId: "el-baul-de-fernando",
      storageBucket: "el-baul-de-fernando.firebasestorage.app",
      messagingSenderId: "648436947805",
      appId: "1:648436947805:web:d38987be3123ce78f766b4",
      measurementId: "G-X7RXQ53VSG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let links = [];

    const defaultLinks = [
      { id: '1', name: "Render Dashboard", url: "https://dashboard.render.com" },
      { id: '2', name: "Amazon KDP", url: "https://kdp.amazon.com" }
    ];

    const linksGrid = document.getElementById('linksGrid');
    const searchInput = document.getElementById('searchInput');
    const addModal = document.getElementById('addModal');
    const authContainer = document.getElementById('authContainer');
    const linkCountBadge = document.getElementById('linkCountBadge');

    function loadLocalLinks() {
      try {
        const stored = localStorage.getItem('min_links_pro');
        links = stored ? JSON.parse(stored) : defaultLinks;
      } catch(e) {
        links = defaultLinks;
      }
    }

    function saveLocalLinks() {
      try {
        localStorage.setItem('min_links_pro', JSON.stringify(links));
      } catch(e) {}
    }

    setPersistence(auth, browserLocalPersistence).catch(console.error);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await fetchCloudLinks(user.uid);
      } else {
        currentUser = null;
        loadLocalLinks();
        renderLinks(links);
        updateAuthUI();
      }
    });

    window.loginWithGoogle = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
        await fetchCloudLinks(currentUser.uid);
        showToast("¡Sincronizado con éxito!");
      } catch (error) {
        console.error("Error al iniciar sesión:", error);
        alert("No se pudo iniciar sesión con Google. Permite las ventanas emergentes.");
      }
    };

    window.logout = async () => {
      try {
        await signOut(auth);
        showToast("Sesión cerrada localmente");
      } catch (error) {
        console.error("Error al cerrar sesión:", error);
      }
    };

    async function fetchCloudLinks(uid) {
      try {
        const q = query(collection(db, "links"), where("uid", "==", uid));
        const querySnapshot = await getDocs(q);
        let cloudLinks = [];
        querySnapshot.forEach((docSnap) => {
          cloudLinks.push({ id: docSnap.id, ...docSnap.data() });
        });
        
        if (cloudLinks.length === 0) {
          loadLocalLinks();
          for (const l of links) {
            await addDoc(collection(db, "links"), {
              uid: uid,
              name: l.name,
              url: l.url,
              createdAt: Date.now()
            });
          }
          await fetchCloudLinks(uid);
          return;
        }

        links = cloudLinks;
        renderLinks(links);
        updateAuthUI();
      } catch (e) {
        console.error("Error cargando de la nube:", e);
        loadLocalLinks();
        renderLinks(links);
      }
    }

    function updateAuthUI() {
      if (currentUser) {
        authContainer.innerHTML = `
          <div class="user-profile-group">
            <img src="${currentUser.photoURL || ''}" class="user-avatar" alt="Avatar">
            <button class="btn-logout" onclick="logout()" title="Cerrar sesión">Salir</button>
          </div>
        `;
      } else {
        authContainer.innerHTML = `
          <button class="btn-google" onclick="loginWithGoogle()">
            <svg viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.22 24 12 24z"/>
              <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.82 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Sincronizar
          </button>
        `;
      }
    }

    window.renderLinks = function(linksToRender) {
      linksGrid.innerHTML = '';
      linkCountBadge.innerText = `${linksToRender.length} ${linksToRender.length === 1 ? 'enlace' : 'enlaces'}`;

      if (linksToRender.length === 0) {
        linksGrid.innerHTML = `<div class="empty-state">No se encontraron enlaces guardados.</div>`;
        return;
      }

      linksToRender.forEach(link => {
        const displayUrl = link.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        let domain = '';
        try { domain = new URL(link.url).hostname; } catch(e) { domain = displayUrl.split('/')[0]; }
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

        const card = document.createElement('a');
        card.href = link.url;
        card.target = "_blank";
        card.className = "link-card";
        
        card.innerHTML = `
          <div class="link-card-top">
            <div class="link-favicon-wrapper">
              <img src="${faviconUrl}" class="link-favicon" onerror="this.style.display='none'">
            </div>
            <div class="link-actions-group">
              <button class="btn-card-action" onclick="copyUrl(event, '${link.url}')" title="Copiar URL">📋</button>
              <button class="btn-card-action btn-delete" onclick="deleteLink('${link.id}', event)" title="Eliminar">✕</button>
            </div>
          </div>
          <div class="link-info">
            <h3>${link.name}</h3>
            <p>${displayUrl}</p>
          </div>
        `;
        linksGrid.appendChild(card);
      });
    }

    window.saveLink = async () => {
      const nameInput = document.getElementById('linkName');
      let urlInput = document.getElementById('linkUrl').value.trim();
      const name = nameInput.value.trim();

      if (!name || !urlInput) return;
      if (!/^https?:\/\//i.test(urlInput)) urlInput = 'https://' + urlInput;

      if (currentUser) {
        try {
          const newLink = { uid: currentUser.uid, name: name, url: urlInput, createdAt: Date.now() };
          const docRef = await addDoc(collection(db, "links"), newLink);
          links.unshift({ id: docRef.id, ...newLink });
        } catch (e) {
          alert("Error al guardar en la nube.");
          return;
        }
      } else {
        const newLink = { id: Date.now().toString(), name: name, url: urlInput };
        links.unshift(newLink);
        saveLocalLinks();
      }

      nameInput.value = '';
      document.getElementById('linkUrl').value = '';
      toggleModal();
      searchInput.value = '';
      renderLinks(links);
      showToast("Enlace guardado con éxito");
    };

    window.deleteLink = async (id, event) => {
      event.preventDefault();
      if (confirm('¿Deseas eliminar este acceso directo?')) {
        if (currentUser) {
          try {
            await deleteDoc(doc(db, "links", id));
            links = links.filter(link => link.id !== id);
          } catch (e) {
            alert("Error al eliminar.");
            return;
          }
        } else {
          links = links.filter(link => link.id !== id);
          saveLocalLinks();
        }
        filterLinks();
        showToast("Enlace eliminado");
      }
    };

    window.copyUrl = (event, url) => {
      event.preventDefault();
      navigator.clipboard.writeText(url).then(() => {
        showToast("¡Enlace copiado al portapapeles!");
      });
    };

    window.filterLinks = () => {
      const queryText = searchInput.value.toLowerCase();
      const filtered = links.filter(link => 
        link.name.toLowerCase().includes(queryText) || link.url.toLowerCase().includes(queryText)
      );
      renderLinks(filtered);
    };

    window.toggleModal = () => {
      addModal.classList.toggle('active');
      if(addModal.classList.contains('active')) document.getElementById('linkName').focus();
    };

    window.closeModalOutside = (e) => {
      if(e.target === addModal) toggleModal();
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    // Bloqueo total de zoom gestual (Pellizco) en móviles modernos y navegadores
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (event) => {
      if (event.scale && event.scale !== 1) event.preventDefault();
    }, { passive: false });
  </script>
</head>
<body>

  <div id="app-content">
    <header>
      <div class="header-top">
        <div class="header-brand">
          <div class="brand-icon">⚡</div>
          <div class="brand-info">
            <h1>Mis Enlaces</h1>
            <span id="linkCountBadge">0 enlaces</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="btn-primary" onclick="toggleModal()">+ Agregar Enlace</button>
          <div id="authContainer">
            <!-- Se carga dinámicamente el estado de Google -->
          </div>
        </div>
      </div>
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar por nombre o URL..." autocomplete="off" oninput="filterLinks()">
      </div>
    </header>

    <main>
      <div class="links-grid" id="linksGrid"></div>
    </main>
  </div>

  <!-- MODAL DE NUEVO ENLACE -->
  <div class="modal-overlay" id="addModal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2>Agregar Nuevo Enlace</h2>
      <div class="input-group">
        <label>Nombre del sitio</label>
        <input type="text" id="linkName" placeholder="Ej. GitHub / Documentación" autocomplete="off">
      </div>
      <div class="input-group">
        <label>Dirección URL</label>
        <input type="url" id="linkUrl" placeholder="Ej. github.com" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal()">Cancelar</button>
        <button class="btn-submit" onclick="saveLink()">Guardar Enlace</button>
      </div>
    </div>
  </div>

  <!-- NOTIFICACIÓN TOAST -->
