<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mis Enlaces - Cloud</title>
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-hover: #1c1c21;
      --border: #27272a;
      --border-focus: #52525b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #f4f4f5;
      --accent-hover: #ffffff;
      --danger: #ef4444;
      --radius: 12px;
      --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
    }

    .hidden {
      display: none !important;
    }

    /* --- PANTALLA DE LOGIN CON GOOGLE --- */
    #login-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 32px 24px;
      border-radius: var(--radius);
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .login-box h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .login-box p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .btn-google {
      width: 100%;
      background: #ffffff;
      color: #18181b;
      border: none;
      padding: 12px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity var(--transition), transform var(--transition);
    }

    .btn-google:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-google svg {
      width: 18px;
      height: 18px;
    }

    /* --- CONTENIDO PRINCIPAL --- */
    #app-content {
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    header {
      width: 100%;
      padding: 30px 0 20px 0;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      z-index: 10;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
    }

    h1 { font-size: 1.1rem; font-weight: 600; }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-primary, .btn-secondary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition);
    }
    .btn-primary:hover, .btn-secondary:hover { background-color: var(--bg-surface); border-color: var(--border-focus); }
    .btn-logout { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
    .btn-logout:hover { background-color: rgba(239, 68, 68, 0.1); border-color: var(--danger); }

    .search-container input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 16px;
      font-size: 0.95rem;
      outline: none;
      border-radius: var(--radius);
      transition: border-color var(--transition);
    }
    .search-container input:focus { border-color: var(--border-focus); }

    main { width: 100%; padding-bottom: 60px; }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .link-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px; 
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all var(--transition);
    }
    .link-card:hover { border-color: var(--border-focus); background-color: var(--bg-hover); transform: translateY(-2px); }

    .link-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding-right: 20px;
    }

    .link-favicon {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .link-card h3 {
      font-size: 0.9rem; 
      font-weight: 500; 
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
    }

    .link-card p {
      font-size: 0.75rem; 
      color: var(--text-muted);
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
    }

    .btn-delete-card {
      position: absolute; top: 14px; right: 14px;
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 0.9rem; opacity: 0;
      transition: opacity var(--transition), color var(--transition);
    }
    .link-card:hover .btn-delete-card { opacity: 1; }
    .btn-delete-card:hover { color: var(--danger); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(6px);
      display: none; justify-content: center; align-items: center; z-index: 100;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-surface); width: 100%; max-width: 380px;
      padding: 24px; border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal h2 { margin-bottom: 16px; font-size: 1rem; font-weight: 500; }
    .input-group { margin-bottom: 14px; }
    .input-group input {
      width: 100%; background: var(--bg-base); border: 1px solid var(--border);
      color: var(--text-main); padding: 12px; border-radius: var(--radius);
      font-size: 0.9rem; outline: none;
    }
    .input-group input:focus { border-color: var(--border-focus); }

    .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
    .btn-cancel, .btn-submit { flex: 1; padding: 12px; border-radius: var(--radius); cursor: pointer; font-size: 0.85rem; font-weight: 500; border: none; }
    .btn-cancel { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
    .btn-cancel:hover { background: var(--bg-hover); }
    .btn-submit { background: var(--text-main); color: var(--bg-base); }
    .btn-submit:hover { opacity: 0.9; }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 0.9rem; grid-column: 1 / -1; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>

  <!-- Firebase SDKs (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // TODO: Reemplaza con tu configuración de proyecto de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_DOMINIO.firebaseapp.com",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_BUCKET.appspot.com",
      messagingSenderId: "TU_MESSAGING_SENDER_ID",
      appId: "TU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let linksCache = [];

    // Elementos DOM
    const loginScreen = document.getElementById('login-screen');
    const appContent = document.getElementById('app-content');
    const linksGrid = document.getElementById('linksGrid');
    const searchInput = document.getElementById('searchInput');
    const addModal = document.getElementById('addModal');
    const userAvatar = document.getElementById('userAvatar');

    // Escuchar estado de autenticación
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        if(user.photoURL) userAvatar.src = user.photoURL;
        loginScreen.classList.add('hidden');
        appContent.classList.remove('hidden');
        await fetchLinks();
      } else {
        currentUser = null;
        appContent.classList.add('hidden');
        loginScreen.classList.remove('hidden');
      }
    });

    // Login con Google
    window.loginWithGoogle = async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (error) {
        console.error("Error en autenticación:", error);
        alert("No se pudo iniciar sesión con Google.");
      }
    };

    // Logout
    window.logout = async () => {
      try {
        await signOut(auth);
      } catch (error) {
        console.error("Error al cerrar sesión:", error);
      }
    };

    // Cargar enlaces de Firestore
    async function fetchLinks() {
      if (!currentUser) return;
      try {
        const q = query(collection(db, "links"), where("uid", "==", currentUser.uid));
        const querySnapshot = await getDocs(q);
        linksCache = [];
        querySnapshot.forEach((docSnap) => {
          linksCache.push({ id: docSnap.id, ...docSnap.data() });
        });
        renderLinks(linksCache);
      } catch (e) {
        console.error("Error cargando enlaces:", e);
        linksGrid.innerHTML = `<div class="empty-state">Error al cargar enlaces desde la nube.</div>`;
      }
    }

    // Renderizar enlaces
    window.renderLinks = function(linksToRender) {
      linksGrid.innerHTML = '';

      if (linksToRender.length === 0) {
        linksGrid.innerHTML = `<div class="empty-state">No hay enlaces guardados.</div>`;
        return;
      }

      linksToRender.forEach(link => {
        const displayUrl = link.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        let domain = '';
        try {
          domain = new URL(link.url).hostname;
        } catch(e) {
          domain = displayUrl.split('/')[0];
        }
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;

        const card = document.createElement('a');
        card.href = link.url;
        card.target = "_blank";
        card.className = "link-card";
        
        card.innerHTML = `
          <div class="link-card-header">
            <img src="${faviconUrl}" class="link-favicon" onerror="this.style.display='none'">
            <h3>${link.name}</h3>
          </div>
          <p>${displayUrl}</p>
          <button class="btn-delete-card" onclick="deleteLink('${link.id}', event)" title="Eliminar">✕</button>
        `;
        linksGrid.appendChild(card);
      });
    }

    // Guardar nuevo enlace
    window.saveLink = async () => {
      const nameInput = document.getElementById('linkName');
      let urlInput = document.getElementById('linkUrl').value.trim();
      const name = nameInput.value.trim();

      if (!name || !urlInput || !currentUser) return;
      if (!/^https?:\/\//i.test(urlInput)) urlInput = 'https://' + urlInput;

      try {
        const newLink = {
          uid: currentUser.uid,
          name: name,
          url: urlInput,
          createdAt: Date.now()
        };
        const docRef = await addDoc(collection(db, "links"), newLink);
        linksCache.unshift({ id: docRef.id, ...newLink });
        
        nameInput.value = '';
        document.getElementById('linkUrl').value = '';
        toggleModal();
        searchInput.value = '';
        renderLinks(linksCache);
      } catch (e) {
        console.error("Error al guardar:", e);
        alert("No se pudo guardar el enlace.");
      }
    };

    // Eliminar enlace
    window.deleteLink = async (id, event) => {
      event.preventDefault();
      if (confirm('¿Deseas eliminar este enlace?')) {
        try {
          await deleteDoc(doc(db, "links", id));
          linksCache = linksCache.filter(link => link.id !== id);
          filterLinks();
        } catch (e) {
          console.error("Error al eliminar:", e);
          alert("No se pudo eliminar el enlace.");
        }
      }
    };

    // Filtrar enlaces localmente por búsqueda instantánea
    window.filterLinks = () => {
      const queryText = searchInput.value.toLowerCase();
      const filtered = linksCache.filter(link => 
        link.name.toLowerCase().includes(queryText) || link.url.toLowerCase().includes(queryText)
      );
      renderLinks(filtered);
    };

    // Control del Modal
    window.toggleModal = () => {
      addModal.classList.toggle('active');
      if(addModal.classList.contains('active')) document.getElementById('linkName').focus();
    };

    window.closeModalOutside = (e) => {
      if(e.target === addModal) toggleModal();
    };

    // Bloqueo de zoom táctil en móviles
    document.addEventListener('gesturestart', (e) => e.preventDefault());
    document.addEventListener('touchmove', (event) => {
      if (event.scale && event.scale !== 1) event.preventDefault();
    }, { passive: false });
  </script>
</head>
<body>

  <!-- PANTALLA DE ACCESO GOOGLE -->
  <div id="login-screen">
    <div class="login-box">
      <h2>Mis Enlaces Cloud</h2>
      <p>Inicia sesión con tu cuenta de Google para sincronizar tus accesos en todos tus dispositivos.</p>
      <button class="btn-google" onclick="loginWithGoogle()">
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.22 24 12 24z"/>
          <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.82 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
        </svg>
        Iniciar sesión con Google
      </button>
    </div>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="app-content" class="hidden">
    <header id="main-header">
      <div class="header-top">
        <div class="header-brand">
          <img id="userAvatar" class="user-avatar" src="" alt="Avatar">
          <h1>Mis Enlaces</h1>
        </div>
        <div class="header-actions">
          <button class="btn-primary" onclick="toggleModal()">+ Agregar</button>
          <button class="btn-secondary btn-logout" onclick="logout()">Salir</button>
        </div>
      </div>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar enlaces..." oninput="filterLinks()">
      </div>
    </header>
    <main>
      <div class="links-grid" id="linksGrid"></div>
    </main>
  </div>

  <!-- MODAL DE NUEVO ENLACE -->
  <div class="modal-overlay" id="addModal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2>Nuevo Enlace</h2>
      <div class="input-group">
        <input type="text" id="linkName" placeholder="Nombre (ej. GitHub)" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="url" id="linkUrl" placeholder="URL (ej. github.com)" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal()">Cancelar</button>
        <button class="btn-submit" onclick="saveLink()">Guardar</button>
      </div>
    </div>
  </div>

</body>
</html>
