<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PocketHub — Tus Enlaces</title>
  
  <!-- Icono / Logo representativo para la app y acceso directo en iPhone / Android -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'></path><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'></path></svg>">
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'></path><path d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'></path></svg>">

  <style>
    :root {
      --bg-base: #0f1015;
      --bg-surface: #181920;
      --bg-card: #1f2029;
      --bg-card-hover: #262833;
      --border: #2d2f3d;
      --border-focus: #6366f1;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-base: #f8fafc;
        --bg-surface: #ffffff;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --border: #e2e8f0;
        --border-focus: #6366f1;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    #app-content {
      width: 100%;
      max-width: 1100px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    header {
      width: 100%;
      padding: 30px 0 20px 0;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      backdrop-filter: blur(12px);
      z-index: 20;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .brand-info h1 { 
      font-size: 1.3rem; 
      font-weight: 700; 
      letter-spacing: -0.02em;
    }

    .brand-info span {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

    .btn-google {
      background: #ffffff;
      color: #18181b;
      border: 1px solid #e4e4e7;
      padding: 9px 14px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
    }
    .btn-google:hover { background: #f4f4f5; }
    .btn-google svg { width: 16px; height: 16px; }

    .user-profile-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 4px 12px 4px 6px;
      border-radius: 50px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
    }

    .btn-logout { 
      color: var(--danger); 
      background: transparent;
      border: none;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .vault-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-surface);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .vault-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .vault-tab.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 18px;
      width: 100%;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-wrapper input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 16px 12px 44px;
      font-size: 0.95rem;
      outline: none;
      border-radius: var(--radius);
      transition: var(--transition);
    }
    .search-wrapper input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .category-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }
    .category-chip:hover { border-color: var(--border-focus); color: var(--text-main); }
    .category-chip.active {
      background: var(--text-main);
      color: var(--bg-base);
      border-color: transparent;
    }

    main { width: 100%; margin-top: 10px; }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .link-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: var(--transition);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .link-card:hover { 
      border-color: var(--border-focus); 
      background-color: var(--bg-card-hover); 
      transform: translateY(-4px); 
    }

    .link-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .link-favicon-large {
      width: 52px;
      height: 52px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .link-favicon-large img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .link-actions-group {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: var(--transition);
    }
    .link-card:hover .link-actions-group { opacity: 1; }

    .btn-card-action {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: var(--transition);
    }
    .btn-card-action:hover { color: var(--text-main); border-color: var(--border-focus); background: var(--bg-card); }
    .btn-delete:hover { color: var(--danger); border-color: rgba(239, 68, 68, 0.4); }

    .link-info h3 {
      font-size: 1.05rem; 
      font-weight: 600; 
      margin-bottom: 6px;
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .link-info p {
      font-size: 0.82rem; 
      color: var(--text-muted);
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      margin-bottom: 14px;
    }

    .link-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .link-category-badge {
      display: inline-block;
      background: var(--bg-base);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .private-tag {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }

    /* Modales */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-surface); width: 100%; max-width: 420px;
      padding: 30px; border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .modal h2 { margin-bottom: 16px; font-size: 1.2rem; font-weight: 700; }
    .modal p { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 16px; line-height: 1.4; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input {
      width: 100%; background: var(--bg-base); border: 1px solid var(--border);
      color: var(--text-main); padding: 12px 14px; border-radius: var(--radius-sm);
      font-size: 0.95rem; outline: none; transition: var(--transition);
    }
    .input-group input:focus { border-color: var(--border-focus); }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .checkbox-group span {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-cancel, .btn-submit { flex: 1; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.9rem; font-weight: 600; border: none; }
    .btn-cancel { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
    .btn-cancel:hover { background: var(--bg-card); }
    .btn-submit { background: var(--accent); color: #fff; }
    .btn-submit:hover { background: var(--accent-hover); }

    .pin-link {
      display: block;
      text-align: right;
      font-size: 0.78rem;
      color: var(--accent);
      margin-top: 8px;
      cursor: pointer;
      text-decoration: none;
    }
    .pin-link:hover { text-decoration: underline; }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-main);
      color: var(--bg-base);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
      grid-column: 1 / -1;
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .link-actions-group { opacity: 1; }
    }
  </style>

  <!-- Firebase SDKs (Modular v10) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6uQzOIIt2vM54CR27G4hvJDWz_NKv61Y",
      authDomain: "el-baul-de-fernando.firebaseapp.com",
      projectId: "el-baul-de-fernando",
      storageBucket: "el-baul-de-fernando.firebasestorage.app",
      messagingSenderId: "648436947805",
      appId: "1:648436947805:web:d38987be3123ce78f766b4",
      measurementId: "G-X7RXQ53VSG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let links = [];
    let currentVault = 'public';
    let currentCategoryFilter = 'Todos';

    const defaultLinks = [
      { id: '1', name: "Render Dashboard", url: "https://dashboard.render.com", category: "Herramientas", isPrivate: false },
      { id: '2', name: "Amazon KDP", url: "https://kdp.amazon.com", category: "Trabajo", isPrivate: false },
      { id: '3', name: "Notas Confidenciales", url: "https://keep.google.com", category: "Privado", isPrivate: true }
    ];

    function loadLocalLinks() {
      try {
        const stored = localStorage.getItem('pockethub_links_v4');
        links = stored ? JSON.parse(stored) : defaultLinks;
      } catch(e) {
        links = defaultLinks;
      }
    }

    function saveLocalLinks() {
      try {
        localStorage.setItem('pockethub_links_v4', JSON.stringify(links));
      } catch(e) {}
    }

    setPersistence(auth, browserLocalPersistence).catch(console.error);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await fetchCloudLinks(user.uid);
      } else {
        currentUser = null;
        loadLocalLinks();
        filterAndRender();
        updateAuthUI();
      }
    });

    window.loginWithGoogle = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        currentUser = result.user;
        await fetchCloudLinks(currentUser.uid);
        showToast("¡Sincronizado con Google!");
      } catch (error) {
        console.error("Error en login:", error);
        alert("No se pudo iniciar sesión con Google. Permite las ventanas emergentes.");
      }
    };

    window.logout = async () => {
      try {
        await signOut(auth);
        showToast("Sesión cerrada");
      } catch (error) {
        console.error("Error al salir:", error);
      }
    };

    async function fetchCloudLinks(uid) {
      try {
        const q = query(collection(db, "links"), where("uid", "==", uid));
        const querySnapshot = await getDocs(q);
        let cloudLinks = [];
        querySnapshot.forEach((docSnap) => {
          cloudLinks.push({ id: docSnap.id, category: 'General', isPrivate: false, ...docSnap.data() });
        });
        
        if (cloudLinks.length === 0) {
          loadLocalLinks();
          for (const l of links) {
            await addDoc(collection(db, "links"), {
              uid: uid,
              name: l.name,
              url: l.url,
              category: l.category || 'General',
              isPrivate: l.isPrivate || false,
              createdAt: Date.now()
            });
          }
          await fetchCloudLinks(uid);
          return;
        }

        links = cloudLinks;
        filterAndRender();
        updateAuthUI();
      } catch (e) {
        console.error("Error nube:", e);
        loadLocalLinks();
        filterAndRender();
      }
    }

    function updateAuthUI() {
      const authContainer = document.getElementById('authContainer');
      if (currentUser) {
        authContainer.innerHTML = `
          <div class="user-profile-group">
            <img src="${currentUser.photoURL || ''}" class="user-avatar" alt="Avatar">
            <button class="btn-logout" onclick="logout()" title="Salir">Salir</button>
          </div>
        `;
      } else {
        authContainer.innerHTML = `
          <button class="btn-google" onclick="loginWithGoogle()">
            <svg viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.18v3.15C3.15 21.32 7.22 24 12 24z"/>
              <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.6H1.18C.43 8.12 0 9.82 0 12s.43 3.88 1.18 5.4l4.09-3.16z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.22 0 3.15 2.68 1.18 6.6l4.09 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Sincronizar
          </button>
        `;
      }
    }

    // --- LÓGICA DE BAÚL PRIVADO Y MODAL DE PIN ---
    window.switchVault = function(vaultType) {
      if (vaultType === 'private') {
        document.getElementById('pinModal').classList.add('active');
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
      } else {
        currentVault = 'public';
        document.querySelectorAll('.vault-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-public').classList.add('active');
        currentCategoryFilter = 'Todos';
        filterAndRender();
      }
    }

    window.verifyPin = function() {
      const enteredPin = document.getElementById('pinInput').value.trim();
      const savedPin = localStorage.getItem('pockethub_pin') || '2027';

      if (enteredPin === savedPin) {
        document.getElementById('pinModal').classList.remove('active');
        currentVault = 'private';
        document.querySelectorAll('.vault-tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-private').classList.add('active');
        currentCategoryFilter = 'Todos';
        filterAndRender();
      } else {
        showToast("PIN incorrecto");
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
      }
    }

    window.closePinModal = function() {
      document.getElementById('pinModal').classList.remove('active');
    }

    window.forgotPin = function() {
      closePinModal();
      const confirmationPhrase = "borrar todo y empezar de nuevo";
      const userInput = prompt(`⚠️ ATENCIÓN:\nPor seguridad, al recuperar el PIN todos los enlaces privados serán borrados.\n\nEscribe exactamente esta frase para continuar:\n"${confirmationPhrase}"`);
      
      if (userInput === confirmationPhrase) {
        links = links.filter(l => !l.isPrivate);
        saveLocalLinks();
        
        const newPin = prompt("¡Frase correcta! Ingresa tu nuevo PIN numérico:");
        if (newPin && newPin.trim().length > 0) {
          localStorage.setItem('pockethub_pin', newPin.trim());
          showToast("¡PIN restablecido con éxito!");
          currentVault = 'public';
          document.querySelectorAll('.vault-tab').forEach(t => t.classList.remove('active'));
          document.getElementById('tab-public').classList.add('active');
          filterAndRender();
        } else {
          localStorage.setItem('pockethub_pin', '2027');
          showToast("PIN restablecido a valor por defecto (2027)");
        }
      } else if (userInput !== null) {
        showToast("La frase no coincide. No se realizaron cambios.");
      }
    }

    window.togglePrivateCategory = function() {
      const isPrivate = document.getElementById('linkIsPrivate').checked;
      const categoryGroup = document.getElementById('categoryGroup');
      categoryGroup.style.display = isPrivate ? 'none' : 'block';
    }

    window.renderCategoriesBar = function() {
      const vaultLinks = links.filter(l => currentVault === 'private' ? l.isPrivate : !l.isPrivate);
      const categories = ['Todos', ...new Set(vaultLinks.map(l => l.category || 'General'))];
      const categoriesBar = document.getElementById('categoriesBar');
      categoriesBar.innerHTML = '';

      categories.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = `category-chip ${currentCategoryFilter === cat ? 'active' : ''}`;
        chip.innerText = cat;
        chip.onclick = () => {
          currentCategoryFilter = cat;
          renderCategoriesBar();
          filterAndRender();
        };
        categoriesBar.appendChild(chip);
      });
    }

    window.filterAndRender = function() {
      renderCategoriesBar();
      const queryText = document.getElementById('searchInput').value.toLowerCase();
      const vaultLinks = links.filter(l => currentVault === 'private' ? l.isPrivate : !l.isPrivate);
      
      const filtered = vaultLinks.filter(link => {
        const matchesQuery = link.name.toLowerCase().includes(queryText) || link.url.toLowerCase().includes(queryText);
        const matchesCategory = currentCategoryFilter === 'Todos' || (link.category || 'General') === currentCategoryFilter;
        return matchesQuery && matchesCategory;
      });

      renderLinksGrid(filtered);
    }

    function renderLinksGrid(linksToRender) {
      const linksGrid = document.getElementById('linksGrid');
      const linkCountBadge = document.getElementById('linkCountBadge');
      linksGrid.innerHTML = '';
      linkCountBadge.innerText = `${linksToRender.length} ${linksToRender.length === 1 ? 'enlace' : 'enlaces'}`;

      if (linksToRender.length === 0) {
        linksGrid.innerHTML = `<div class="empty-state">No hay enlaces en este baúl. ¡Agrega uno nuevo!</div>`;
        return;
      }

      linksToRender.forEach(link => {
        const displayUrl = link.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        let domain = '';
        try { domain = new URL(link.url).hostname; } catch(e) { domain = displayUrl.split('/')[0]; }
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;

        const card = document.createElement('a');
        card.href = link.url;
        card.target = "_blank";
        card.className = "link-card";
        
        card.innerHTML = `
          <div class="link-card-header">
            <div class="link-favicon-large">
              <img src="${faviconUrl}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239ca3af%22 stroke-width=%222%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/><line x1=%2212%22 y1=%228%22 x2=%2212%22 y2=%2212%22/><line x1=%2212%22 y1=%2216%22 x2=%2212.01%22 y2=%2216%22/></svg>'">
            </div>
            <div class="link-actions-group">
              <button class="btn-card-action" onclick="copyUrl(event, '${link.url}')" title="Copiar URL">📋</button>
              <button class="btn-card-action btn-delete" onclick="deleteLink('${link.id}', event)" title="Eliminar">✕</button>
            </div>
          </div>
          <div class="link-info">
            <h3>${link.name}</h3>
            <p>${displayUrl}</p>
          </div>
          <div class="link-card-footer">
            <span class="link-category-badge">${link.category || 'General'}</span>
            ${link.isPrivate ? '<span class="link-category-badge private-tag">Privado</span>' : ''}
          </div>
        `;
        linksGrid.appendChild(card);
      });
    }

    window.saveLink = async function() {
      const nameInput = document.getElementById('linkName');
      let urlInput = document.getElementById('linkUrl').value.trim();
      const isPrivateInput = document.getElementById('linkIsPrivate').checked;
      const categoryInput = isPrivateInput ? 'Privado' : (document.getElementById('linkCategory').value.trim() || 'General');
      const name = nameInput.value.trim();

      if (!name || !urlInput) return;
      if (!/^https?:\/\//i.test(urlInput)) urlInput = 'https://' + urlInput;

      if (currentUser && !isPrivateInput) {
        try {
          const newLink = { uid: currentUser.uid, name: name, url: urlInput, category: categoryInput, isPrivate: false, createdAt: Date.now() };
          const docRef = await addDoc(collection(db, "links"), newLink);
          links.unshift({ id: docRef.id, ...newLink });
        } catch (e) {
          alert("Error al guardar en la nube.");
          return;
        }
      } else {
        const newLink = { id: Date.now().toString(), name: name, url: urlInput, category: categoryInput, isPrivate: isPrivateInput };
        links.unshift(newLink);
        saveLocalLinks();
      }

      nameInput.value = '';
      document.getElementById('linkUrl').value = '';
      document.getElementById('linkIsPrivate').checked = false;
      document.getElementById('categoryGroup').style.display = 'block';
      toggleModal();
      filterAndRender();
      showToast("¡Enlace guardado con éxito!");
    };

    window.deleteLink = async function(id, event) {
      event.preventDefault();
      if (confirm('¿Deseas eliminar este enlace?')) {
        const linkToDelete = links.find(l => l.id === id);
        if (currentUser && linkToDelete && !linkToDelete.isPrivate) {
          try {
            await deleteDoc(doc(db, "links", id));
          } catch(e) {}
        }
        links = links.filter(link => link.id !== id);
        saveLocalLinks();
        filterAndRender();
        showToast("Enlace eliminado");
      }
    };

    window.copyUrl = function(event, url) {
      event.preventDefault();
      navigator.clipboard.writeText(url).then(() => {
        showToast("¡Enlace copiado al portapapeles!");
      });
    };

    window.toggleModal = function() {
      const modal = document.getElementById('addModal');
      modal.classList.toggle('active');
      if(modal.classList.contains('active')) document.getElementById('linkName').focus();
    };

    window.closeModalOutside = function(e) {
      if(e.target === document.getElementById('addModal')) toggleModal();
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }
  </script>
</head>
<body onload="loadLocalLinks(); filterAndRender();">

  <div id="app-content">
    <header>
      <div class="header-top">
        <div class="header-brand">
          <div class="brand-icon">
            <!-- Logo representativo de Enlace / Cadena -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
          </div>
          <div class="brand-info">
            <h1>PocketHub</h1>
            <span id="linkCountBadge">0 enlaces</span>
          </div>
        </div>

        <div class="header-actions">
          <div class="vault-tabs">
            <button class="vault-tab active" id="tab-public" onclick="switchVault('public')">Públicos</button>
            <button class="vault-tab" id="tab-private" onclick="switchVault('private')">🔒 Privados</button>
          </div>
          <button class="btn-primary" onclick="toggleModal()">+ Agregar</button>
          <div id="authContainer"></div>
        </div>
      </div>

      <div class="controls-container">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar en tus lecturas..." autocomplete="off" oninput="filterAndRender()">
        </div>
        <div class="categories-bar" id="categoriesBar"></div>
      </div>
    </header>

    <main>
      <div class="links-grid" id="linksGrid"></div>
    </main>
  </div>

  <!-- MODAL DE INGRESO DE PIN PRIVADO CON OPCIÓN DE RECUPERAR -->
  <div class="modal-overlay" id="pinModal">
    <div class="modal">
      <h2>Acceso Privado</h2>
      <p>Introduce tu PIN de seguridad para desbloquear el baúl privado:</p>
      <div class="input-group">
        <input type="password" id="pinInput" placeholder="••••" autocomplete="off" maxlength="10" onkeypress="if(event.key === 'Enter') verifyPin()">
      </div>
      <a class="pin-link" onclick="forgotPin()">¿Olvidaste tu PIN?</a>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closePinModal()">Cancelar</button>
        <button class="btn-submit" onclick="verifyPin()">Ingresar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE NUEVO ENLACE -->
  <div class="modal-overlay" id="addModal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2>Guardar Nuevo Enlace</h2>
      <div class="input-group">
        <label>Título del Sitio</label>
        <input type="text" id="linkName" placeholder="Ej. Artículo de Interés" autocomplete="off">
      </div>
      <div class="input-group">
        <label>URL de la Web</label>
        <input type="url" id="linkUrl" placeholder="Ej. medium.com/articulo" autocomplete="off">
      </div>
      <div class="input-group" id="categoryGroup">
        <label>Categoría</label>
        <input type="text" id="linkCategory" list="defaultCategories" placeholder="Ej. Lectura, Trabajo..." autocomplete="off">
        <datalist id="defaultCategories">
          <option value="Lectura"></option>
          <option value="Trabajo"></option>
          <option value="Herramientas"></option>
          <option value="Personal"></option>
        </datalist>
      </div>
      <div class="input-group">
        <label class="checkbox-group">
          <input type="checkbox" id="linkIsPrivate" onchange="togglePrivateCategory()">
          <span>Guardar en el Baúl Privado (Protegido con PIN)</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal()">Cancelar</button>
        <button class="btn-submit" onclick="saveLink()">Guardar en Pocket</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

</body>
</html>
