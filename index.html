<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Enlaces</title>
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #18181b;
      --bg-hover: #27272a;
      --border: #3f3f46;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #f4f4f5; /* Acento blanco/minimalista */
      --accent-hover: #ffffff;
      --danger: #ef4444;
      --radius: 8px; /* Bordes menos redondeados para un look más serio */
      --transition: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Ocultar elementos */
    .hidden {
      display: none !important;
    }

    /* --- PANTALLA DE BLOQUEO (PIN) --- */
    #login-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg-base);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .login-box {
      width: 100%;
      max-width: 320px;
      text-align: center;
    }

    .login-box h2 {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 24px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .pin-input-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .pin-input-group input {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: var(--radius);
      font-size: 1.2rem;
      text-align: center;
      outline: none;
      letter-spacing: 4px;
    }

    .pin-input-group input:focus {
      border-color: var(--accent);
    }

    .btn-login {
      background: var(--accent);
      color: var(--bg-base);
      border: none;
      padding: 12px;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: opacity var(--transition);
    }

    .btn-login:hover {
      opacity: 0.9;
    }

    #pin-error {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 1.2em;
    }

    /* --- CONTENIDO PRINCIPAL DE LA APP --- */
    #app-content {
      width: 100%;
      max-width: 900px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease;
    }

    header {
      width: 100%;
      padding: 30px 0 20px 0;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      z-index: 10;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .btn-primary {
      background-color: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition);
    }

    .btn-primary:hover {
      background-color: var(--bg-surface);
      border-color: var(--text-muted);
    }

    .search-container input {
      width: 100%;
      background-color: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 0;
      font-size: 0.95rem;
      outline: none;
      border-radius: 0;
      transition: border-color var(--transition);
    }

    .search-container input:focus {
      border-color: var(--text-main);
    }

    /* Grid de Enlaces (Más pequeñas y compactas) */
    main {
      width: 100%;
      padding-bottom: 60px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }

    .link-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px; /* Padding reducido */
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: border-color var(--transition), background var(--transition);
    }

    .link-card:hover {
      border-color: var(--text-muted);
      background-color: var(--bg-hover);
    }

    .link-card h3 {
      font-size: 0.9rem; /* Letra más pequeña */
      font-weight: 500;
      margin-bottom: 4px;
      padding-right: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-card p {
      font-size: 0.75rem; /* URL más discreta */
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-delete-card {
      position: absolute;
      top: 12px;
      right: 12px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      opacity: 0;
      transition: opacity var(--transition), color var(--transition);
    }

    .link-card:hover .btn-delete-card { opacity: 1; }
    .btn-delete-card:hover { color: var(--danger); }

    /* Modal Minimalista */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-base);
      width: 100%;
      max-width: 360px;
      padding: 24px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .modal h2 {
      margin-bottom: 20px;
      font-size: 1rem;
      font-weight: 500;
    }

    .input-group { margin-bottom: 16px; }
    .input-group input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      outline: none;
    }
    .input-group input:focus { border-color: var(--text-muted); }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .btn-cancel, .btn-submit {
      flex: 1;
      padding: 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      border: none;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn-cancel:hover { background: var(--bg-surface); }
    
    .btn-submit {
      background: var(--text-main);
      color: var(--bg-base);
    }
    .btn-submit:hover { opacity: 0.9; }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
      grid-column: 1 / -1;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <h2>ACCESO RESTRINGIDO</h2>
      <div class="pin-input-group">
        <input type="password" id="pin-input" placeholder="••••••" autocomplete="off">
        <button class="btn-login" onclick="checkPin()">INGRESAR</button>
      </div>
      <div id="pin-error"></div>
    </div>
  </div>

  <div id="app-content" class="hidden">
    <header id="main-header">
      <div class="header-top">
        <h1>Enlaces</h1>
        <button class="btn-primary" onclick="toggleModal()">+ Agregar</button>
      </div>
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Buscar..." oninput="filterLinks()">
      </div>
    </header>

    <main>
      <div class="links-grid" id="linksGrid"></div>
    </main>
  </div>

  <div class="modal-overlay" id="addModal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2>Nuevo Enlace</h2>
      <div class="input-group">
        <input type="text" id="linkName" placeholder="Nombre" autocomplete="off">
      </div>
      <div class="input-group">
        <input type="url" id="linkUrl" placeholder="URL (ej. github.com)" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal()">Cancelar</button>
        <button class="btn-submit" onclick="saveLink()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // --- LÓGICA DEL PIN ---
    const CORRECT_PIN = "2027LF";
    const pinInput = document.getElementById('pin-input');

    // Comprobar si ya iniciamos sesión en esta pestaña (se borra al cerrar el navegador)
    if (sessionStorage.getItem('isAuthenticated') === 'true') {
      unlockApp();
    } else {
      pinInput.focus();
    }

    // Permitir presionar "Enter" para ingresar
    pinInput.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') checkPin();
    });

    function checkPin() {
      const errorDiv = document.getElementById('pin-error');
      if (pinInput.value.toUpperCase() === CORRECT_PIN) {
        sessionStorage.setItem('isAuthenticated', 'true');
        unlockApp();
      } else {
        errorDiv.innerText = "PIN incorrecto.";
        pinInput.value = '';
        pinInput.focus();
      }
    }

    function unlockApp() {
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');
      renderLinks(); // Cargar enlaces solo cuando se desbloquea
    }

    // --- LÓGICA DE LOS ENLACES ---
    const defaultLinks = [
      { id: 1, name: "Render Dashboard", url: "https://dashboard.render.com" },
      { id: 2, name: "Amazon KDP", url: "https://kdp.amazon.com" }
    ];

    let links = JSON.parse(localStorage.getItem('min_links')) || defaultLinks;

    const linksGrid = document.getElementById('linksGrid');
    const addModal = document.getElementById('addModal');
    const searchInput = document.getElementById('searchInput');

    function renderLinks(linksToRender = links) {
      linksGrid.innerHTML = '';

      if (linksToRender.length === 0) {
        linksGrid.innerHTML = `<div class="empty-state">No hay enlaces.</div>`;
        return;
      }

      linksToRender.forEach(link => {
        const displayUrl = link.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        const card = document.createElement('a');
        card.href = link.url;
        card.target = "_blank";
        card.className = "link-card";
        
        card.innerHTML = `
          <h3>${link.name}</h3>
          <p>${displayUrl}</p>
          <button class="btn-delete-card" onclick="deleteLink(${link.id}, event)" title="Eliminar">✕</button>
        `;
        linksGrid.appendChild(card);
      });
    }

    function toggleModal() {
      addModal.classList.toggle('active');
      if(addModal.classList.contains('active')) document.getElementById('linkName').focus();
    }

    function closeModalOutside(e) {
      if(e.target === addModal) toggleModal();
    }

    function saveLink() {
      const nameInput = document.getElementById('linkName');
      let urlInput = document.getElementById('linkUrl').value.trim();
      const name = nameInput.value.trim();

      if (!name || !urlInput) return;
      if (!/^https?:\/\//i.test(urlInput)) urlInput = 'https://' + urlInput;

      links.unshift({ id: Date.now(), name: name, url: urlInput });
      localStorage.setItem('min_links', JSON.stringify(links));
      
      nameInput.value = ''; document.getElementById('linkUrl').value = '';
      toggleModal();
      searchInput.value = '';
      renderLinks();
    }

    function deleteLink(id, event) {
      event.preventDefault();
      if(confirm('¿Borrar enlace?')) {
        links = links.filter(link => link.id !== id);
        localStorage.setItem('min_links', JSON.stringify(links));
        filterLinks();
      }
    }

    function filterLinks() {
      const query = searchInput.value.toLowerCase();
      renderLinks(links.filter(link => 
        link.name.toLowerCase().includes(query) || link.url.toLowerCase().includes(query)
      ));
    }
  </script>
</body>
</html>
