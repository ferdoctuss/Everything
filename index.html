<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PocketHub — Tus Enlaces con Estilo</title>
  <style>
    :root {
      --bg-base: #0f1015;
      --bg-surface: #181920;
      --bg-card: #1f2029;
      --bg-card-hover: #262833;
      --border: #2d2f3d;
      --border-focus: #6366f1;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --danger: #ef4444;
      --radius: 16px;
      --radius-sm: 10px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-base: #f8fafc;
        --bg-surface: #ffffff;
        --bg-card: #ffffff;
        --bg-card-hover: #f1f5f9;
        --border: #e2e8f0;
        --border-focus: #6366f1;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: manipulation;
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    #app-content {
      width: 100%;
      max-width: 1100px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.3s ease;
    }

    /* --- CABECERA ESTILO POCKET --- */
    header {
      width: 100%;
      padding: 30px 0 20px 0;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      backdrop-filter: blur(12px);
      z-index: 20;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      color: #fff;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .brand-info h1 { 
      font-size: 1.3rem; 
      font-weight: 700; 
      letter-spacing: -0.02em;
    }

    .brand-info span {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
    }
    .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); }

    /* Navegación de Baúles (Públicos / Privados) */
    .vault-tabs {
      display: flex;
      gap: 8px;
      background: var(--bg-surface);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }

    .vault-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }
    .vault-tab.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* Controles y Búsqueda */
    .controls-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 18px;
      width: 100%;
    }

    .search-wrapper {
      position: relative;
      width: 100%;
    }

    .search-wrapper input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 16px 12px 44px;
      font-size: 0.95rem;
      outline: none;
      border-radius: var(--radius);
      transition: var(--transition);
    }
    .search-wrapper input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1rem;
    }

    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories-bar::-webkit-scrollbar { display: none; }

    .category-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }
    .category-chip:hover { border-color: var(--border-focus); color: var(--text-main); }
    .category-chip.active {
      background: var(--text-main);
      color: var(--bg-base);
      border-color: transparent;
    }

    /* --- GRID DE TARJETAS TIPO POCKET (LOGOS GRANDES) --- */
    main { width: 100%; margin-top: 10px; }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .link-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: var(--transition);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .link-card:hover { 
      border-color: var(--border-focus); 
      background-color: var(--bg-card-hover); 
      transform: translateY(-4px); 
    }

    .link-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    /* Logo / Favicon Grande Protagonista */
    .link-favicon-large {
      width: 52px;
      height: 52px;
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .link-favicon-large img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .link-actions-group {
      display: flex;
      gap: 6px;
      opacity: 0;
      transition: var(--transition);
    }
    .link-card:hover .link-actions-group { opacity: 1; }

    .btn-card-action {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: var(--transition);
    }
    .btn-card-action:hover { color: var(--text-main); border-color: var(--border-focus); background: var(--bg-card); }
    .btn-delete:hover { color: var(--danger); border-color: rgba(239, 68, 68, 0.4); }

    .link-info h3 {
      font-size: 1.05rem; 
      font-weight: 600; 
      margin-bottom: 6px;
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .link-info p {
      font-size: 0.82rem; 
      color: var(--text-muted);
      white-space: nowrap; 
      overflow: hidden; 
      text-overflow: ellipsis;
      margin-bottom: 14px;
    }

    .link-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: auto;
    }

    .link-category-badge {
      display: inline-block;
      background: var(--bg-base);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .private-tag {
      background: rgba(239, 68, 68, 0.1);
      color: var(--danger);
      border-color: rgba(239, 68, 68, 0.2);
    }

    /* --- MODAL --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-surface); width: 100%; max-width: 420px;
      padding: 30px; border-radius: var(--radius); border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .modal h2 { margin-bottom: 20px; font-size: 1.2rem; font-weight: 700; }
    
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input {
      width: 100%; background: var(--bg-base); border: 1px solid var(--border);
      color: var(--text-main); padding: 12px 14px; border-radius: var(--radius-sm);
      font-size: 0.95rem; outline: none; transition: var(--transition);
    }
    .input-group input:focus { border-color: var(--border-focus); }

    /* Checkbox personalizado para Privado */
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 10px;
      cursor: pointer;
      user-select: none;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .checkbox-group span {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
    .btn-cancel, .btn-submit { flex: 1; padding: 12px; border-radius: var(--radius-sm); cursor: pointer; font-size: 0.9rem; font-weight: 600; border: none; }
    .btn-cancel { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
    .btn-cancel:hover { background: var(--bg-card); }
    .btn-submit { background: var(--accent); color: #fff; }
    .btn-submit:hover { background: var(--accent-hover); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-main);
      color: var(--bg-base);
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 1000;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 0.95rem;
      grid-column: 1 / -1;
      background: var(--bg-surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .link-actions-group { opacity: 1; }
    }
  </style>

  <script>
    let links = [];
    let currentVault = 'public'; // 'public' o 'private'
    let currentCategoryFilter = 'Todos';

    const defaultLinks = [
      { id: '1', name: "Render Dashboard", url: "https://dashboard.render.com", category: "Herramientas", isPrivate: false },
      { id: '2', name: "Amazon KDP", url: "https://kdp.amazon.com", category: "Trabajo", isPrivate: false },
      { id: '3', name: "Notas Confidenciales", url: "https://keep.google.com", category: "Personal", isPrivate: true }
    ];

    function initApp() {
      try {
        const stored = localStorage.getItem('pockethub_links');
        links = stored ? JSON.parse(stored) : defaultLinks;
      } catch(e) {
        links = defaultLinks;
      }
      filterAndRender();
    }

    function saveLinks() {
      try {
        localStorage.setItem('pockethub_links', JSON.stringify(links));
      } catch(e) {}
    }

    window.switchVault = function(vaultType) {
      if (vaultType === 'private') {
        const pin = prompt("Introduce el PIN de seguridad para acceder al baúl privado (PIN por defecto: 2027):");
        if (pin !== "2027") {
          showToast("PIN incorrecto");
          return;
        }
      }
      currentVault = vaultType;
      document.querySelectorAll('.vault-tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`tab-${vaultType}`).classList.add('active');
      currentCategoryFilter = 'Todos';
      filterAndRender();
    }

    window.renderCategoriesBar = function() {
      const vaultLinks = links.filter(l => currentVault === 'private' ? l.isPrivate : !l.isPrivate);
      const categories = ['Todos', ...new Set(vaultLinks.map(l => l.category || 'General'))];
      const categoriesBar = document.getElementById('categoriesBar');
      categoriesBar.innerHTML = '';

      categories.forEach(cat => {
        const chip = document.createElement('button');
        chip.className = `category-chip ${currentCategoryFilter === cat ? 'active' : ''}`;
        chip.innerText = cat;
        chip.onclick = () => {
          currentCategoryFilter = cat;
          renderCategoriesBar();
          filterAndRender();
        };
        categoriesBar.appendChild(chip);
      });
    }

    window.filterAndRender = function() {
      renderCategoriesBar();
      const queryText = document.getElementById('searchInput').value.toLowerCase();
      
      const vaultLinks = links.filter(l => currentVault === 'private' ? l.isPrivate : !l.isPrivate);
      
      const filtered = vaultLinks.filter(link => {
        const matchesQuery = link.name.toLowerCase().includes(queryText) || link.url.toLowerCase().includes(queryText);
        const matchesCategory = currentCategoryFilter === 'Todos' || (link.category || 'General') === currentCategoryFilter;
        return matchesQuery && matchesCategory;
      });

      renderLinksGrid(filtered);
    }

    function renderLinksGrid(linksToRender) {
      const linksGrid = document.getElementById('linksGrid');
      const linkCountBadge = document.getElementById('linkCountBadge');
      linksGrid.innerHTML = '';
      linkCountBadge.innerText = `${linksToRender.length} ${linksToRender.length === 1 ? 'enlace' : 'enlaces'}`;

      if (linksToRender.length === 0) {
        linksGrid.innerHTML = `<div class="empty-state">No hay enlaces en este baúl. ¡Agrega uno nuevo!</div>`;
        return;
      }

      linksToRender.forEach(link => {
        const displayUrl = link.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
        let domain = '';
        try { domain = new URL(link.url).hostname; } catch(e) { domain = displayUrl.split('/')[0]; }
        const faviconUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`; // Tamaño grande y nítido estilo Pocket

        const card = document.createElement('a');
        card.href = link.url;
        card.target = "_blank";
        card.className = "link-card";
        
        card.innerHTML = `
          <div class="link-card-header">
            <div class="link-favicon-large">
              <img src="${faviconUrl}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2224%22 height=%2224%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239ca3af%22 stroke-width=%222%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/><line x1=%2212%22 y1=%228%22 x2=%2212%22 y2=%2212%22/><line x1=%2212%22 y1=%2216%22 x2=%2212.01%22 y2=%2216%22/></svg>'">
            </div>
            <div class="link-actions-group">
              <button class="btn-card-action" onclick="copyUrl(event, '${link.url}')" title="Copiar URL">📋</button>
              <button class="btn-card-action btn-delete" onclick="deleteLink('${link.id}', event)" title="Eliminar">✕</button>
            </div>
          </div>
          <div class="link-info">
            <h3>${link.name}</h3>
            <p>${displayUrl}</p>
          </div>
          <div class="link-card-footer">
            <span class="link-category-badge">${link.category || 'General'}</span>
            ${link.isPrivate ? '<span class="link-category-badge private-tag">Privado</span>' : ''}
          </div>
        `;
        linksGrid.appendChild(card);
      });
    }

    window.saveLink = function() {
      const nameInput = document.getElementById('linkName');
      let urlInput = document.getElementById('linkUrl').value.trim();
      const categoryInput = document.getElementById('linkCategory').value.trim() || 'General';
      const isPrivateInput = document.getElementById('linkIsPrivate').checked;
      const name = nameInput.value.trim();

      if (!name || !urlInput) return;
      if (!/^https?:\/\//i.test(urlInput)) urlInput = 'https://' + urlInput;

      const newLink = { 
        id: Date.now().toString(), 
        name: name, 
        url: urlInput, 
        category: categoryInput, 
        isPrivate: isPrivateInput 
      };
      
      links.unshift(newLink);
      saveLinks();

      nameInput.value = '';
      document.getElementById('linkUrl').value = '';
      document.getElementById('linkIsPrivate').checked = false;
      toggleModal();
      filterAndRender();
      showToast("¡Enlace guardado con éxito!");
    };

    window.deleteLink = function(id, event) {
      event.preventDefault();
      if (confirm('¿Deseas eliminar este enlace?')) {
        links = links.filter(link => link.id !== id);
        saveLinks();
        filterAndRender();
        showToast("Enlace eliminado");
      }
    };

    window.copyUrl = function(event, url) {
      event.preventDefault();
      navigator.clipboard.writeText(url).then(() => {
        showToast("¡Enlace copiado al portapapeles!");
      });
    };

    window.toggleModal = function() {
      const modal = document.getElementById('addModal');
      modal.classList.toggle('active');
      if(modal.classList.contains('active')) document.getElementById('linkName').focus();
    };

    window.closeModalOutside = function(e) {
      if(e.target === document.getElementById('addModal')) toggleModal();
    };

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); }, 2500);
    }
  </script>
</head>
<body onload="initApp()">

  <div id="app-content">
    <header>
      <div class="header-top">
        <div class="header-brand">
          <div class="brand-icon">📚</div>
          <div class="brand-info">
            <h1>PocketHub</h1>
            <span id="linkCountBadge">0 enlaces</span>
          </div>
        </div>

        <div class="header-actions">
          <!-- Selector de Baúles (Público / Privado) -->
          <div class="vault-tabs">
            <button class="vault-tab active" id="tab-public" onclick="switchVault('public')">Públicos</button>
            <button class="vault-tab" id="tab-private" onclick="switchVault('private')">🔒 Privados</button>
          </div>
          <button class="btn-primary" onclick="toggleModal()">+ Agregar</button>
        </div>
      </div>

      <div class="controls-container">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Buscar en tus lecturas..." autocomplete="off" oninput="filterAndRender()">
        </div>
        <div class="categories-bar" id="categoriesBar"></div>
      </div>
    </header>

    <main>
      <div class="links-grid" id="linksGrid"></div>
    </main>
  </div>

  <!-- MODAL DE NUEVO ENLACE CON OPCIÓN PRIVADA -->
  <div class="modal-overlay" id="addModal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2>Guardar Nuevo Enlace</h2>
      <div class="input-group">
        <label>Título del Sitio</label>
        <input type="text" id="linkName" placeholder="Ej. Artículo de Interés" autocomplete="off">
      </div>
      <div class="input-group">
        <label>URL de la Web</label>
        <input type="url" id="linkUrl" placeholder="Ej. medium.com/articulo" autocomplete="off">
      </div>
      <div class="input-group">
        <label>Categoría</label>
        <input type="text" id="linkCategory" list="defaultCategories" placeholder="Ej. Lectura, Trabajo..." autocomplete="off">
        <datalist id="defaultCategories">
          <option value="Lectura"></option>
          <option value="Trabajo"></option>
          <option value="Herramientas"></option>
          <option value="Personal"></option>
        </datalist>
      </div>
      <div class="input-group">
        <label class="checkbox-group">
          <input type="checkbox" id="linkIsPrivate">
          <span>Guardar en el Baúl Privado (Protegido)</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal()">Cancelar</button>
        <button class="btn-submit" onclick="saveLink()">Guardar en Pocket</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

</body>
</html>
