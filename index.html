<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Enlaces</title>
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #18181b;
      --bg-hover: #27272a;
      --border: #3f3f46;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --radius: 12px;
      --transition: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      padding: 0 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Cabecera y Buscador */
    header {
      width: 100%;
      max-width: 1000px;
      padding: 40px 0 30px 0;
      position: sticky;
      top: 0;
      background: var(--bg-base);
      z-index: 10;
      border-bottom: 1px solid transparent;
      transition: border-bottom var(--transition);
    }

    header.scrolled {
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background var(--transition);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    /* Buscador */
    .search-container {
      position: relative;
      width: 100%;
    }

    .search-container input {
      width: 100%;
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 14px 20px 14px 44px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-container input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Grid de Enlaces */
    main {
      width: 100%;
      max-width: 1000px;
      padding-bottom: 60px;
    }

    .links-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 10px;
    }

    .link-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform var(--transition), border-color var(--transition), background var(--transition);
    }

    .link-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      background-color: var(--bg-hover);
    }

    .link-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 6px;
      padding-right: 24px; /* Espacio para el botón de borrar */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .link-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-delete-card {
      position: absolute;
      top: 16px;
      right: 16px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 4px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity var(--transition), color var(--transition), background var(--transition);
    }

    .link-card:hover .btn-delete-card {
      opacity: 1;
    }

    .btn-delete-card:hover {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
    }

    /* Modal para agregar enlace */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.2s ease forwards;
    }

    .modal {
      background: var(--bg-surface);
      width: 100%;
      max-width: 400px;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .modal h2 {
      margin-bottom: 20px;
      font-size: 1.3rem;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .input-group input:focus { border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn-cancel {
      flex: 1;
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-cancel:hover { background: var(--bg-hover); }
    
    .btn-submit {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
    }
    
    .btn-submit:hover { background: var(--accent-hover); }

    /* Estado vacío */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <header id="main-header">
    <div class="header-top">
      <h1>🔗 Mis Enlaces</h1>
      <button class="btn-primary" onclick="toggleModal()">
        <span>+</span> Nuevo Enlace
      </button>
    </div>
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar por nombre o URL..." oninput="filterLinks()">
    </div>
  </header>

  <main>
    <div class="links-grid" id="linksGrid">
      </div>
  </main>

  <div class="modal-overlay" id="addModal" onclick="closeModalOutside(event)">
    <div class="modal">
      <h2>Agregar Nuevo Enlace</h2>
      <div class="input-group">
        <label for="linkName">Nombre del sitio</label>
        <input type="text" id="linkName" placeholder="Ej. GitHub" autocomplete="off">
      </div>
      <div class="input-group">
        <label for="linkUrl">URL</label>
        <input type="url" id="linkUrl" placeholder="https://..." autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="toggleModal()">Cancelar</button>
        <button class="btn-submit" onclick="saveLink()">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    // Enlaces iniciales de ejemplo
    const defaultLinks = [
      { id: 1, name: "Universidad Científica del Sur", url: "https://www.cientifica.edu.pe" },
      { id: 2, name: "Cambridge One", url: "https://www.cambridgeone.org" },
      { id: 3, name: "Amazon KDP", url: "https://kdp.amazon.com" },
      { id: 4, name: "Dota 2 Wiki", url: "https://dota2.fandom.com/wiki/Dota_2_Wiki" }
    ];

    let links = JSON.parse(localStorage.getItem('pure_links')) || defaultLinks;

    const linksGrid = document.getElementById('linksGrid');
    const addModal = document.getElementById('addModal');
    const searchInput = document.getElementById('searchInput');

    // Sombra en el header al hacer scroll
    window.addEventListener('scroll', () => {
      const header = document.getElementById('main-header');
      if (window.scrollY > 10) header.classList.add('scrolled');
      else header.classList.remove('scrolled');
    });

    function renderLinks(linksToRender = links) {
      linksGrid.innerHTML = '';

      if (linksToRender.length === 0) {
        linksGrid.innerHTML = `
          <div class="empty-state">
            <p style="font-size: 3rem; margin-bottom: 10px;">📭</p>
            <p>No hay enlaces que coincidan.</p>
          </div>
        `;
        return;
      }

      linksToRender.forEach(link => {
        // Formatear URL para mostrarla bonita (quitar https://)
        const displayUrl = link.url.replace(/^https?:\/\//, '').replace(/\/$/, '');

        const card = document.createElement('a');
        card.href = link.url;
        card.target = "_blank";
        card.className = "link-card";
        
        card.innerHTML = `
          <h3>${link.name}</h3>
          <p>${displayUrl}</p>
          <button class="btn-delete-card" onclick="deleteLink(${link.id}, event)" title="Eliminar">🗑️</button>
        `;
        
        linksGrid.appendChild(card);
      });
    }

    function toggleModal() {
      addModal.classList.toggle('active');
      if(addModal.classList.contains('active')) {
        document.getElementById('linkName').focus();
      }
    }

    function closeModalOutside(e) {
      if(e.target === addModal) toggleModal();
    }

    function saveLink() {
      const nameInput = document.getElementById('linkName');
      let urlInput = document.getElementById('linkUrl').value;
      const name = nameInput.value.trim();

      if (!name || !urlInput) return alert('Por favor llena ambos campos');
      
      // Auto-completar https:// si falta
      if (!/^https?:\/\//i.test(urlInput)) {
        urlInput = 'https://' + urlInput;
      }

      const newLink = {
        id: Date.now(),
        name: name,
        url: urlInput
      };

      links.unshift(newLink); // Agregar al principio
      localStorage.setItem('pure_links', JSON.stringify(links));
      
      nameInput.value = '';
      document.getElementById('linkUrl').value = '';
      
      toggleModal();
      searchInput.value = ''; // Limpiar búsqueda
      renderLinks();
    }

    function deleteLink(id, event) {
      event.preventDefault(); // Evita que se abra el enlace al tocar el botón de borrar
      
      if(confirm('¿Eliminar este enlace?')) {
        links = links.filter(link => link.id !== id);
        localStorage.setItem('pure_links', JSON.stringify(links));
        filterLinks(); // Mantener el filtro activo si se estaba buscando algo
      }
    }

    function filterLinks() {
      const query = searchInput.value.toLowerCase();
      const filtered = links.filter(link => 
        link.name.toLowerCase().includes(query) || 
        link.url.toLowerCase().includes(query)
      );
      renderLinks(filtered);
    }

    // Inicializar
    renderLinks();
  </script>
</body>
</html>
